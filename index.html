<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kişisel Bütçe Paneli</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Özel CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="d-flex min-vh-100">
    <!-- Sol Menü -->
    <aside class="sidebar p-3 d-none d-md-flex flex-column">
      <h4 class="text-white fw-bold mb-4">BütçePanel</h4>
      <ul class="nav flex-column gap-2">
        <li class="nav-item">
          <a class="nav-link active text-white" href="#">Genel Bakış</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-secondary" href="#islemler-alani">İşlemler</a>
        </li>
      </ul>
      <div class="mt-auto small text-secondary">
        Öğrenci Projesi • HTML/CSS/JS
      </div>
    </aside>

    <!-- Ana İçerik -->
    <main class="flex-grow-1 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="h4 fw-bold mb-0">Finansal Özet</h2>
          <small class="text-muted">Gelir ve giderlerini anlık takip et</small>
        </div>
        <span class="badge bg-primary-subtle text-primary px-3 py-2">Aktif Panel</span>
      </div>

      <!-- Özet Kartları -->
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="card stat-card border-0 shadow-sm">
            <div class="card-body">
              <div class="text-muted small">Toplam Bakiye</div>
              <div id="toplam-bakiye" class="fs-3 fw-bold mt-1">0 ₺</div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card stat-card border-0 shadow-sm">
            <div class="card-body">
              <div class="text-muted small">Toplam Gelir</div>
              <div id="toplam-gelir" class="fs-3 fw-bold text-success mt-1">0 ₺</div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card stat-card border-0 shadow-sm">
            <div class="card-body">
              <div class="text-muted small">Toplam Gider</div>
              <div id="toplam-gider" class="fs-3 fw-bold text-danger mt-1">0 ₺</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Form ve Tablo -->
      <div id="islemler-alani" class="row g-4">
        <div class="col-lg-4">
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <h5 class="card-title fw-bold mb-3">Yeni İşlem Ekle</h5>
              <form id="islem-formu">
                <div class="mb-3">
                  <label for="baslik" class="form-label">Açıklama</label>
                  <input type="text" id="baslik" class="form-control" placeholder="Örn: Burs, Market, Yemek" required />
                </div>
                <div class="mb-3">
                  <label for="tutar" class="form-label">Tutar (₺)</label>
                  <input type="number" id="tutar" class="form-control" min="1" step="0.01" placeholder="Örn: 250" required />
                </div>
                <div class="mb-3">
                  <label for="tur" class="form-label">Tür</label>
                  <select id="tur" class="form-select">
                    <option value="gelir">Gelir</option>
                    <option value="gider">Gider</option>
                  </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Kaydet</button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="card-title fw-bold mb-0">İşlem Geçmişi</h5>
                <button id="tumunu-temizle" type="button" class="btn btn-sm btn-outline-danger">Tümünü Sil</button>
              </div>
              <div class="table-responsive">
                <table class="table align-middle">
                  <thead>
                    <tr>
                      <th>Açıklama</th>
                      <th>Tür</th>
                      <th>Tutar</th>
                      <th class="text-end">İşlem</th>
                    </tr>
                  </thead>
                  <tbody id="islem-listesi"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Özel JS -->
  <script src="script.js"></script>
</body>
</html>
